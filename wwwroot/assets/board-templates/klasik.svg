    <rect x="20" y="30" width="140" height="200" rx="12" fill="#dbe6f0" stroke="#c3d3e2"/>
    <rect x="30" y="44" width="120" height="30" rx="6" fill="#ffffff" stroke="#c3d3e2"/>
    <rect x="30" y="82" width="120" height="30" rx="6" fill="#ffffff" stroke="#c3d3e2"/>
    <rect x="30" y="120" width="120" height="30" rx="6" fill="#ffffff" stroke="#c3d3e2"/>
  </g>
  <g>
    <rect x="170" y="30" width="140" height="200" rx="12" fill="#dbe6f0" stroke="#c3d3e2"/>
    <rect x="180" y="44" width="120" height="30" rx="6" fill="#ffffff" stroke="#c3d3e2"/>
    <rect x="180" y="82" width="120" height="30" rx="6" fill="#ffffff" stroke="#c3d3e2"/>
  </g>
  <g>
